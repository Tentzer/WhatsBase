[project]
name = "whatsbase-backend"
version = "0.1.0"
description = "WhatsApp AI Agent Builder Platform — backend (Builder agent + Conversation agent)"
requires-python = ">=3.12"
dependencies = [
    # web / async
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # queue
    "arq>=0.26",
    "redis>=5.2",
    # llm providers
    "anthropic>=0.39",
    "openai>=1.54",
    # platform integrations
    "supabase>=2.10",
    "whatsapp-api-client-python>=0.0.49",
    # observability
    "langfuse>=2.53",
    # token encryption (per-tenant Green API tokens at rest)
    "cryptography>=43",
    # image conversion for WhatsApp (webp → jpeg before send)
    "pillow>=11.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "greenlet>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
